<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>TONARI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TONARI — Un mundo más cerca." />
    <meta name="theme-color" content="#111116" />
    <!-- Modo claro / oscuro (extra): se aplica ANTES de que cargue Angular, para que
         la página no aparezca un instante en oscuro y después cambie. -->
    <script>
      (function () {
        var tema;
        try {
          tema = localStorage.getItem('tonari-tema');
        } catch (e) {}
        if (tema !== 'claro' && tema !== 'oscuro') {
          tema = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        }
        document.documentElement.dataset.tema = tema;
      })();
    </script>
    <!-- Favicon propio, transparente. Los navegadores sin soporte de SVG
         buscan solos /favicon.ico como respaldo. "?v=2" evita que quede el viejo en caché. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" sizes="any" />

    <!-- PWA: el manifiesto dice el nombre, los íconos y los colores de la app instalada -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iPhone/iPad no leen los íconos del manifiesto: usan este -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TONARI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Tipografías de Google Fonts. Si no cargan, se usan las de respaldo del CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
