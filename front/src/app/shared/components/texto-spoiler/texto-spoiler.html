<!-- Todo en una línea a propósito: el padre respeta espacios y saltos de línea (pre-line), y cualquier salto acá se vería. Un spoiler tapado es un "botón" (role=button) en vez de <button>, porque un <button> no puede cortarse en dos renglones. -->
@for (parte of partes(); track $index) {@if (!parte.spoiler) {<span>{{ parte.texto }}</span>} @else if (destapados().has($index)) {<span class="spoiler destapado">{{ parte.texto }}</span>} @else {<span class="spoiler" role="button" tabindex="0" aria-label="Spoiler oculto. Tocá para verlo" title="Spoiler: tocá para verlo" (click)="destapar($index)" (keydown.enter)="destapar($index)" (keydown.space)="$event.preventDefault(); destapar($index)"><span aria-hidden="true">{{ parte.texto }}</span></span>}}
