    @let pub = publicacion();

    <article class="panel tarjeta" [attr.aria-labelledby]="'titulo-' + pub._id">
    <!-- Autor y fecha -->
    <header class="autor">
        <img [src]="pub.usuario.imagenPerfil" alt="" class="autor-foto" width="44" height="44" />
        <div class="autor-datos">
        <p class="autor-nombre">{{ pub.usuario.nombre }} {{ pub.usuario.apellido }}</p>
        <p class="texto-secundario autor-detalle">
            &#64;{{ pub.usuario.nombreUsuario }} ·
            <!-- Un momento: se muestra en hora argentina -->
            <time [attr.datetime]="pub.createdAt">
            {{ pub.createdAt | date: 'dd/MM/yyyy HH:mm' : '-0300' }}
            </time>
        </p>
        </div>
    </header>

    <h2 class="titulo" [id]="'titulo-' + pub._id">{{ pub.titulo }}</h2>
    <p class="descripcion">{{ pub.descripcion }}</p>

    @if (pub.imagen) {
        <img [src]="pub.imagen" [alt]="'Imagen de la publicación: ' + pub.titulo" class="imagen" loading="lazy" />
    }

    <!-- Cantidad de "Me gusta" (los botones llegan en la próxima tanda) -->
    <footer class="pie">
        <span class="me-gusta">
        <svg class="icono" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
        </svg>
        {{ pub.cantidadMeGusta }} Me gusta
        </span>
    </footer>
    </article>
