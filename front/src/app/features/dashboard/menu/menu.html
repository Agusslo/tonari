<header class="encabezado">
  <div class="fila-titulo">
    <div class="titulos">
      <p class="kicker">Panel de administración</p>
      <h1>
        Dashboard
        <span class="titulo-ja" lang="ja" aria-hidden="true">管理</span>
      </h1>
      <p class="texto-secundario bajada">
        Gestioná las cuentas y seguí la actividad de la comunidad.
      </p>
    </div>

    <ul class="meta" aria-label="Sesión">
      <li class="meta-item meta-admin">
        <svg class="icono" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6L12 3z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        Administrador
      </li>
      <li class="meta-item">
        <svg class="icono" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
          <path d="M3.5 10h17M8 3v4M16 3v4" />
        </svg>
        <time [attr.datetime]="hoyIso">{{ hoyTexto }}</time>
      </li>
    </ul>
  </div>

  <!-- Pestañas: la activa con la rayita menta abajo -->
  <nav class="pestanas" aria-label="Secciones del dashboard">
    <a routerLink="/dashboard/usuarios" routerLinkActive="activa" ariaCurrentWhenActive="page">
      <svg class="icono" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <circle cx="9" cy="8" r="3.5" />
        <path
          d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6"
        />
      </svg>
      Usuarios
    </a>
    <a routerLink="/dashboard/estadisticas" routerLinkActive="activa" ariaCurrentWhenActive="page">
      <svg class="icono" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
      </svg>
      Estadísticas
    </a>
  </nav>
</header>
