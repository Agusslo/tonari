    <p class="texto-secundario">

    </p>
  </div>
  <p class="nota">
    <svg class="icono" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    </svg>
    Fechas en hora de Argentina
  </p>

<div class="graficos">

  <app-grafico
    cual="publicaciones-por-usuario"

  />

  <!-- Líneas: cómo cambia algo día a día -->

    cual="comentarios"

  />

  <!-- Torta: cómo se reparten los comentarios entre publicaciones -->

    class="ancho"
    cual="comentarios-por-publicacion"

    descripcion="Las publicaciones con más comentarios; el resto se agrupa en «Otras»."
  />
</div>

<!-- Sprint 5: ingresos, visitas a mi perfil y "Me gusta" -->
<div class="intro">
  <div>
    <h2>Uso de la app</h2>
    <p class="texto-secundario">Quién entra, quién visita tu perfil y cuántos "Me gusta" se dan.</p>
  </div>
</div>

<div class="graficos">
  <!-- Barras horizontales: comparar entre usuarios -->
  <app-grafico
    cual="ingresos-por-usuario"
